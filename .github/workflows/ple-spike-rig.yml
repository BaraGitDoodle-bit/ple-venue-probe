name: ple-spike-rig
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ple-spike-rig
  cancel-in-progress: false
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Fail fast if secrets are missing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN secret is missing or empty" >&2; exit 1; fi
          echo "required secrets present (names only, values never printed)"
      - name: System specs
        run: |
          date +%s > start-epoch.txt
          echo "nproc: $(nproc)"
          free -m
          df -h / | tail -1
          docker --version
      - name: Set up uv + Python 3.12
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install 3.12
          uv --version
      - name: Clone ple @8320f04
        run: |
          git clone https://github.com/google-research/ple ple
          cd ple && git checkout 8320f04 && git log --oneline -1
      - name: Install Harbor 0.20.0
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install harbor==0.20.0 --with websockets
          harbor --version
      - name: Build rig entry (plan-verify-rig)
        run: |
          cp -r ple/sample_submissions/plan-verify entry-plan-verify-rig
          python3 - <<'PY'
          p = 'entry-plan-verify-rig/submission.yaml'
          s = open(p).read()
          assert 'name: plan-verify' in s
          assert 'model_api: google-cloud/claude-opus-5-5' in s
          s = s.replace('name: plan-verify', 'name: plan-verify-rig')
          s = s.replace('model_api: google-cloud/claude-opus-5-5',
                        'model_api: "openai-compatible/qwen3-8b-abliterated"\nmodel_base_url: https://win-responses-wool-contractor.trycloudflare.com/v1')
          open(p, 'w').write(s)
          print(open(p).read())
          PY
          cd entry-plan-verify-rig && git init -q && git add -A && git -c user.email=spike@local -c user.name=spike commit -qm 'plan-verify-rig' && git log --oneline -1
      - name: Write local.env (dummy key; rig takes no auth)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          umask 077
          printf 'MODEL_API_KEY=free\n' > ple/local.env
          printf 'HF_TOKEN=%s\n' "$HF_TOKEN" >> ple/local.env
          chmod 600 ple/local.env
          cut -d= -f1 ple/local.env
      - name: kit validate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd ple && uv run python -m kit validate ../entry-plan-verify-rig
      - name: kit check (non-gating)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd ple && uv run python -m kit check ../entry-plan-verify-rig --env-file local.env --model-base-url https://win-responses-wool-contractor.trycloudflare.com/v1 > ../kitcheck.log 2>&1 || echo "kit check exited non-zero (non-gating)"
          tail -n 60 ../kitcheck.log
      - name: Eval — ONE task only (frame-extension-method)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd ple && uv run python eval/run.py ../entry-plan-verify-rig --env-file local.env --model-base-url https://win-responses-wool-contractor.trycloudflare.com/v1 --tasks frame-extension-method
      - name: Write spike-result-rig.txt
        if: always()
        run: |
          END=$(date +%s)
          START=$(cat start-epoch.txt 2>/dev/null || echo "$END")
          {
            echo "# PLE spike result (GitHub Actions + Kaggle self-host rig v4)"
            echo "run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "job wall time (s): $((END - START))"
            echo "model declared: openai-compatible/qwen3-8b-abliterated"
            echo "model_base_url: https://win-responses-wool-contractor.trycloudflare.com/v1"
            echo "task: frame-extension-method (checks-graded, one task only)"
            echo "ple commit: 8320f04"
          } > spike-result-rig.txt
          python3 - <<'PY' >> spike-result-rig.txt
          import glob, json, os
          try:
              fs = sorted(glob.glob('ple/runs/*/results.json'))
              print('results.json files:', fs if fs else 'NONE')
              for f in fs[-1:]:
                  d = json.load(open(f))
                  print('results file:', f)
                  print('top-level keys:', sorted(d.keys()))
                  trials = d.get('trials') or d.get('results') or []
                  if isinstance(trials, dict):
                      trials = list(trials.values())
                  for t in trials if isinstance(trials, list) else []:
                      if not isinstance(t, dict):
                          continue
                      print('trial:', {k: t.get(k) for k in ('task', 'task_id', 'name', 'score', 'status', 'duration_s', 'wall_time_s', 'attempts') if k in t})
                  s = json.dumps(d)[:1500]
                  print('results head:', s)
          except Exception as e:
              print('summarizer error:', type(e).__name__)
          try:
              cfs = sorted(glob.glob('ple/**/check.json', recursive=True))
              print('check.json files:', cfs if cfs else 'NONE')
              for f in cfs[-1:]:
                  print('check head:', open(f).read()[:800])
          except Exception as e:
              print('check summarizer error:', type(e).__name__)
          PY
          echo "=== kitcheck.log tail ===" >> spike-result-rig.txt
          tail -n 20 kitcheck.log >> spike-result-rig.txt 2>/dev/null || echo "(no kitcheck.log)" >> spike-result-rig.txt
      - name: Fail if a secret value appears in upload paths (quiet scan)
        id: secret-scan
        if: always()
        env:
          SCAN_HF: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$SCAN_HF" ]; then echo "scan secret is empty; refusing to publish artifacts" >&2; exit 1; fi
          leak=0
          for p in ple/runs/ kitcheck.log spike-result-rig.txt; do
            if [ -e "$p" ] && grep -rFq -- "$SCAN_HF" "$p" 2>/dev/null; then leak=1; fi
          done
          if [ "$leak" -eq 1 ]; then echo "secret value found in upload paths; refusing to publish artifacts" >&2; exit 1; fi
          echo "scan clean (names only, values never printed)"
      - name: Commit spike-result-rig.txt back to main
        if: ${{ always() && steps.secret-scan.outcome == 'success' }}
        run: |
          git config user.name "ple-spike"
          git config user.email "ple-spike@local"
          git checkout main 2>/dev/null || git checkout -b main
          git add spike-result-rig.txt
          git commit -m "spike result (rig) ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push origin main || echo "push failed"
      - name: Upload run artifacts
        if: ${{ always() && steps.secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: spike-run-rig-${{ github.run_id }}
          path: |
            ple/runs/
            kitcheck.log
            spike-result-rig.txt
          if-no-files-found: warn
          retention-days: 30
